<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Novel Forge · 小说缔造</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05070f; --ink:#eaf0ff; --ink-d:#a9bbe0; --ink-dd:#62739a;
  --sky:#5fb0ff; --violet:#b077ff; --gold:#f5c451;
  --card:rgba(12,18,34,0.55); --card-line:rgba(130,160,220,0.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Rajdhani',system-ui,sans-serif;color:var(--ink);
  background:var(--bg);overflow-x:hidden;
}

/* ============ 第一屏：首页 ============ */
.hero{
  min-height:100vh;position:relative;display:flex;flex-direction:column;
  background:
    radial-gradient(1100px 760px at 72% -12%, rgba(60,90,180,0.20), transparent 60%),
    radial-gradient(1000px 700px at 8% 112%, rgba(150,80,210,0.16), transparent 60%),
    var(--bg);
}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;
  padding:40px clamp(20px,5vw,72px) 10px}
.brand .kicker{font-size:13px;letter-spacing:.42em;color:var(--ink-dd);text-transform:uppercase;font-weight:600}
.brand h1{font-family:'Orbitron',sans-serif;font-weight:800;font-size:clamp(28px,4.4vw,52px);
  letter-spacing:.02em;line-height:1;
  background:linear-gradient(100deg,#dff0ff,#9ec6ff 45%,#c8a6ff);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 30px rgba(120,170,255,0.18)}
.brand .sub{font-size:15px;color:var(--ink-d);font-weight:500;margin-top:6px}
.by{text-align:right;font-size:14px;color:var(--ink-dd);line-height:1.5}
.by b{color:var(--ink);font-weight:700;letter-spacing:.06em}
.by a{color:var(--ink-d);text-decoration:none;border-bottom:1px dashed rgba(150,170,210,0.4)}

.grid{display:grid;gap:clamp(16px,2vw,26px);grid-template-columns:repeat(auto-fill,minmax(248px,1fr));
  padding:30px clamp(20px,5vw,72px);align-content:start;flex:1}
.card{position:relative;border-radius:18px;overflow:hidden;background:var(--card);
  border:1px solid var(--card-line);backdrop-filter:blur(10px) saturate(120%);
  -webkit-backdrop-filter:blur(10px) saturate(120%);
  box-shadow:0 18px 50px -22px rgba(0,0,0,0.7),inset 0 1px 0 rgba(255,255,255,0.05);
  min-height:208px;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;
  transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease}
.card:hover{transform:translateY(-4px);border-color:rgba(150,180,240,0.45);
  box-shadow:0 26px 60px -20px rgba(40,80,180,0.55)}
.card .cover{position:absolute;inset:0;opacity:.85;mix-blend-mode:screen}
.card .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,8,16,0.05),rgba(5,8,16,0.55) 55%,rgba(5,8,16,0.92))}
.card .body{position:relative;z-index:1}
.card .genre{display:inline-flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.chip{font-size:11px;letter-spacing:.08em;color:#cfe0ff;background:rgba(90,130,220,0.18);
  border:1px solid rgba(120,160,230,0.3);padding:3px 9px;border-radius:999px;font-weight:600;text-transform:uppercase}
.card h3{font-size:21px;font-weight:700;margin-bottom:6px}
.card .meta{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-d);font-weight:500}
.card .bar{height:5px;border-radius:99px;background:rgba(255,255,255,0.1);overflow:hidden;margin-top:10px}
.card .bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--sky),var(--violet))}
.card .pct{font-variant-numeric:tabular-nums;color:var(--ink)}
.newcard{border:1.5px dashed rgba(140,170,230,0.35);background:rgba(255,255,255,0.02);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;cursor:pointer;
  color:var(--ink-d);min-height:208px}
.newcard .plus{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:30px;
  font-weight:300;color:#bcd4ff;background:radial-gradient(circle at 50% 40%,rgba(95,176,255,0.25),rgba(95,176,255,0.04));
  border:1px solid rgba(140,180,255,0.4);transition:transform .25s ease}
.newcard:hover .plus{transform:scale(1.08) rotate(90deg)}
.newcard span{font-size:15px;font-weight:600;letter-spacing:.05em}

.footer{padding:18px clamp(20px,5vw,72px) 26px;display:flex;justify-content:space-between;
  align-items:center;gap:16px;font-size:13px;color:var(--ink-dd);border-top:1px solid rgba(130,160,220,0.1)}

/* 上滑指引 */
.swipe-hint{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;
  padding:12px 22px;border-radius:999px;background:rgba(10,15,28,0.5);
  border:1px solid rgba(140,170,230,0.25);backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);transition:background .25s ease,border-color .25s ease}
.swipe-hint:hover{background:rgba(20,30,55,0.7);border-color:rgba(150,180,240,0.5)}
.swipe-hint .txt{font-size:13px;letter-spacing:.18em;color:var(--ink-d);font-weight:600;text-transform:uppercase}
.swipe-hint svg{width:26px;height:16px}
.swipe-hint .arrow{animation:floatUp 1.8s ease-in-out infinite}
@keyframes floatUp{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-7px);opacity:1}}

/* ============ 第二屏：行星大视图 ============ */
.galaxy{position:relative;min-height:100vh;overflow:hidden;background:#03050b}
#bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.galaxy-ui{position:absolute;inset:0;pointer-events:none;z-index:2}
.galaxy-ui > *{pointer-events:auto}
.g-title{position:absolute;top:30px;left:clamp(20px,5vw,60px);font-family:'Orbitron',sans-serif;
  font-weight:800;font-size:clamp(20px,2.6vw,30px);letter-spacing:.06em;
  background:linear-gradient(100deg,#dff0ff,#9ec6ff 60%,#c8a6ff);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 30px rgba(120,170,255,0.2)}
.g-title small{display:block;font-family:'Rajdhani';font-weight:600;font-size:13px;
  letter-spacing:.3em;color:var(--ink-dd);text-transform:uppercase;-webkit-text-fill-color:var(--ink-dd)}
.g-back{position:absolute;top:30px;right:clamp(20px,5vw,60px);
  font-family:'Rajdhani';font-weight:600;font-size:14px;letter-spacing:.08em;color:var(--ink);
  background:rgba(12,18,34,0.6);border:1px solid rgba(140,170,230,0.3);border-radius:999px;
  padding:9px 18px;cursor:pointer;backdrop-filter:blur(8px);transition:background .2s,border-color .2s}
.g-back:hover{background:rgba(30,45,80,0.8);border-color:rgba(150,180,240,0.6)}
.g-foot{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);
  font-size:13px;letter-spacing:.12em;color:var(--ink-dd);background:rgba(10,15,28,0.45);
  padding:8px 18px;border-radius:999px;border:1px solid rgba(140,170,230,0.18);white-space:nowrap}

/* 详情卡（点击星球弹出） */
.detail{position:absolute;top:50%;right:clamp(16px,4vw,56px);transform:translateY(-50%) translateX(40px);
  width:300px;max-width:80vw;opacity:0;visibility:hidden;transition:opacity .3s ease,transform .3s ease;
  background:rgba(10,15,28,0.72);border:1px solid rgba(150,180,240,0.35);border-radius:18px;
  padding:22px;backdrop-filter:blur(14px);box-shadow:0 24px 60px -20px rgba(0,0,0,0.8)}
.detail.show{opacity:1;visibility:visible;transform:translateY(-50%) translateX(0)}
.detail .d-close{position:absolute;top:12px;right:14px;width:28px;height:28px;border-radius:50%;
  border:1px solid rgba(150,170,240,0.3);background:transparent;color:var(--ink-d);cursor:pointer;font-size:16px;line-height:1}
.detail .d-close:hover{color:var(--ink);border-color:rgba(150,180,240,0.6)}
.detail .d-genre{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.detail h3{font-size:24px;font-weight:700;margin-bottom:10px}
.detail .d-desc{font-size:14px;color:var(--ink-d);line-height:1.55;margin-bottom:14px}
.detail .d-meta{font-size:13px;color:var(--ink-d);margin-bottom:6px}
.detail .d-bar{height:6px;border-radius:99px;background:rgba(255,255,255,0.1);overflow:hidden;margin-bottom:16px}
.detail .d-bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--violet))}
.detail .d-enter{width:100%;padding:11px;border:none;border-radius:12px;cursor:pointer;
  font-family:'Rajdhani';font-weight:700;font-size:15px;letter-spacing:.06em;color:#04101f;
  background:linear-gradient(100deg,#9ec6ff,#c8a6ff);transition:filter .2s}
.detail .d-enter:hover{filter:brightness(1.1)}

@media (max-width:640px){
  .topbar{flex-direction:column;align-items:flex-start;gap:10px}
  .by{text-align:left}
  .detail{top:auto;bottom:90px;right:50%;transform:translateX(50%) translateY(20px);width:88vw}
  .detail.show{transform:translateX(50%) translateY(0)}
}
@media (prefers-reduced-motion: reduce){
  .swipe-hint .arrow{animation:none}
}
</style>
</head>
<body>

<!-- 第一屏：首页 -->
<section class="hero">
  <header class="topbar">
    <div class="brand">
      <span class="kicker">AI Novel Studio</span>
      <h1>Novel Forge</h1>
      <span class="sub">小说缔造 · 在星球之间，孕育每一个故事</span>
    </div>
    <div class="by">
      Crafted by <b>RuiTri</b><br>
      <a href="https://github.com/huanweide/novel-forge" target="_blank" rel="noreferrer">github.com/huanweide/novel-forge</a>
    </div>
  </header>

  <main class="grid" id="grid"></main>

  <footer class="footer">
    <span>本地运行 · 数据存于你的本机 PostgreSQL</span>
    <span>Novel Forge · 小说缔造</span>
  </footer>

  <div class="swipe-hint" id="swipeHint" title="上滑探索创作星系">
    <svg class="arrow" viewBox="0 0 26 16" fill="none" stroke="#9ec6ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 13 L13 4 L23 13"/>
    </svg>
    <span class="txt">上滑 · 探索创作星系</span>
  </div>
</section>

<!-- 第二屏：行星大视图 -->
<section class="galaxy" id="galaxy">
  <canvas id="bg"></canvas>
  <div class="galaxy-ui">
    <div class="g-title">创作星系 · Nova Orbit<small>THE CREATIVE COSMOS</small></div>
    <button class="g-back" id="backBtn">← 返回首页</button>
    <div class="g-foot">拖拽旋转视角 · 滚轮缩放 · 点击星球查看作品</div>

    <div class="detail" id="detail">
      <button class="d-close" id="dClose">×</button>
      <div class="d-genre" id="dGenre"></div>
      <h3 id="dTitle"></h3>
      <p class="d-desc" id="dDesc"></p>
      <div class="d-meta">创作进度 <span id="dPct" style="color:var(--ink)"></span></div>
      <div class="d-bar"><i id="dBar"></i></div>
      <button class="d-enter">进入阅读 →</button>
    </div>
  </div>
</section>

<script src="./three.min.js"></script>
<script src="./OrbitControls.js"></script>
<script>
/* ============ 第一屏：小说卡片 ============ */
const WORKS = [
  {title:"山海拾遗", genre:["东方","志怪"], progress:72, c1:"#1f6f6b", c2:"#0c2b3a", desc:"上古山海之间，散落的异兽与遗闻。"},
  {title:"仙侠开局骨架", genre:["仙侠","修真"], progress:45, c1:"#3a2c6b", c2:"#120a2b", desc:"以一卷残破功法为起点的修行路。"},
  {title:"沈砚觉醒", genre:["都市","异能"], progress:88, c1:"#6b3a2c", c2:"#2b120a", desc:"平凡青年在雨夜后看见世界的另一面。"},
  {title:"探讨中的小说", genre:["待定"], progress:8, c1:"#2c5a6b", c2:"#0a1f2b", desc:"尚在构思，等待一个落笔的理由。"},
];
const grid = document.getElementById('grid');
WORKS.forEach(w=>{
  const el=document.createElement('article'); el.className='card';
  el.innerHTML=`<div class="cover" style="background:radial-gradient(120% 90% at 20% 10%, ${w.c1}cc, transparent 60%),radial-gradient(120% 120% at 90% 100%, ${w.c2}, #05070f 75%)"></div>
    <div class="veil"></div><div class="body">
    <div class="genre">${w.genre.map(g=>`<span class="chip">${g}</span>`).join('')}</div>
    <h3>${w.title}</h3><div class="meta"><span>进度</span><span class="pct">${w.progress}%</span></div>
    <div class="bar"><i style="width:${w.progress}%"></i></div></div>`;
  grid.appendChild(el);
});
const ne=document.createElement('article'); ne.className='card newcard';
ne.innerHTML=`<div class="plus">+</div><span>创建新小说</span>`; grid.appendChild(ne);

/* 上滑指引 / 返回 */
document.getElementById('swipeHint').addEventListener('click',()=>{
  document.getElementById('galaxy').scrollIntoView({behavior:'smooth'});
});
document.getElementById('backBtn').addEventListener('click',()=>{
  document.querySelector('.hero').scrollIntoView({behavior:'smooth'});
});

/* ============ 第二屏：Three.js 行星 ============ */
const canvas=document.getElementById('bg');
const galaxyEl=document.getElementById('galaxy');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setClearColor(0x03050b,1);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(52,1,0.1,200);
camera.position.set(0,1.5,11);

const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=0.08;
controls.enablePan=false; controls.minDistance=5; controls.maxDistance=26;
controls.autoRotate=true; controls.autoRotateSpeed=0.35;
controls.target.set(0,0,0);

const NOISE=`
float hash(vec3 p){ p=fract(p*vec3(0.1031,0.1030,0.0973)); p+=dot(p,p.yxz+33.33); return fract((p.x+p.y)*p.z); }
float vnoise(vec3 x){ vec3 i=floor(x); vec3 f=fract(x); f=f*f*(3.0-2.0*f);
  float n000=hash(i+vec3(0,0,0)),n100=hash(i+vec3(1,0,0)),n010=hash(i+vec3(0,1,0)),n110=hash(i+vec3(1,1,0));
  float n001=hash(i+vec3(0,0,1)),n101=hash(i+vec3(1,0,1)),n011=hash(i+vec3(0,1,1)),n111=hash(i+vec3(1,1,1));
  float nx00=mix(n000,n100,f.x),nx10=mix(n010,n110,f.x),nx01=mix(n001,n101,f.x),nx11=mix(n011,n111,f.x);
  return mix(mix(nx00,nx10,f.y),mix(nx01,nx11,f.y),f.z); }
float fbm(vec3 p){ float v=0.0,a=0.5; for(int i=0;i<6;i++){ v+=a*vnoise(p); p*=2.02; a*=0.5; } return v; }
`;

/* 中央高清地球（很大） */
const earthMat=new THREE.ShaderMaterial({
  uniforms:{uTime:{value:0}},
  vertexShader:`varying vec3 vPos; varying vec3 vWN; varying vec3 vVN; varying vec3 vView;
    void main(){ vPos=position; vWN=normalize(mat3(modelMatrix)*normal);
      vec4 mv=modelViewMatrix*vec4(position,1.0); vVN=normalize(normalMatrix*normal);
      vView=normalize(-mv.xyz); gl_Position=projectionMatrix*mv; }`,
  fragmentShader:NOISE+`
    uniform float uTime; varying vec3 vPos; varying vec3 vWN; varying vec3 vVN; varying vec3 vView;
    void main(){ vec3 p=normalize(vPos);
      float ang=uTime*0.04;
      mat3 rot=mat3(cos(ang),0.0,sin(ang),0.0,1.0,0.0,-sin(ang),0.0,cos(ang));
      vec3 sp=rot*p;
      float cont=fbm(sp*1.9); float land=smoothstep(0.50,0.57,cont);
      float od=fbm(sp*2.6+11.0);
      vec3 deep=vec3(0.015,0.10,0.32), shallow=vec3(0.04,0.34,0.62);
      vec3 ocean=mix(deep,shallow,od);
      float h=fbm(sp*3.1+5.0);
      vec3 low=vec3(0.12,0.34,0.13), high=vec3(0.46,0.36,0.20);
      vec3 landc=mix(low,high,smoothstep(0.40,0.72,h));
      float ice=smoothstep(0.80,0.96,abs(p.y)); landc=mix(landc,vec3(0.92,0.96,1.0),ice);
      vec3 col=mix(ocean,landc,land);
      float cl=fbm(sp*2.3+vec3(uTime*0.012,0.0,0.0)); float cm=smoothstep(0.60,0.74,cl);
      col=mix(col,vec3(1.0),cm*0.55);
      vec3 L=normalize(vec3(0.55,0.35,0.75));
      float diff=clamp(dot(normalize(vWN),L),0.0,1.0); col*=(0.32+0.78*diff);
      float fres=pow(1.0-max(dot(normalize(vVN),vView),0.0),3.0);
      col+=vec3(0.30,0.55,1.0)*fres*0.55;
      gl_FragColor=vec4(col,1.0); }`
});
const earth=new THREE.Mesh(new THREE.SphereGeometry(3.0,160,160),earthMat);
scene.add(earth);

const atmo=new THREE.Mesh(new THREE.SphereGeometry(3.3,96,96),
  new THREE.ShaderMaterial({side:THREE.BackSide,blending:THREE.AdditiveBlending,transparent:true,depthWrite:false,
    vertexShader:`varying vec3 vVN; varying vec3 vView; void main(){ vec4 mv=modelViewMatrix*vec4(position,1.0);
      vVN=normalize(normalMatrix*normal); vView=normalize(-mv.xyz); gl_Position=projectionMatrix*mv; }`,
    fragmentShader:`varying vec3 vVN; varying vec3 vView; void main(){ float f=pow(1.0-max(dot(normalize(vVN),vView),0.0),2.4);
      gl_FragColor=vec4(vec3(0.35,0.6,1.0)*f*1.1,f); }`}));
scene.add(atmo);

/* 周围创意星球（高清新球 + 多特征 + 分布填满） */
const planetVert=`varying vec3 vPos; varying vec3 vWN; varying vec3 vVN; varying vec3 vView;
  void main(){ vPos=position; vWN=normalize(mat3(modelMatrix)*normal);
    vec4 mv=modelViewMatrix*vec4(position,1.0); vVN=normalize(normalMatrix*normal);
    vView=normalize(-mv.xyz); gl_Position=projectionMatrix*mv; }`;
function planetFrag(){ return NOISE+`
  uniform float uTime; uniform vec3 uA; uniform vec3 uB; uniform float uMode; uniform float uGlow;
  varying vec3 vPos; varying vec3 vWN; varying vec3 vVN; varying vec3 vView;
  void main(){ vec3 p=normalize(vPos); vec3 col;
    if(uMode<0.5){ float bands=sin(p.y*16.0+fbm(p*2.2)*7.0+uTime*0.05); col=mix(uA,uB,smoothstep(-0.35,0.35,bands)); col+=uB*pow(max(bands,0.0),4.0)*0.15; }
    else if(uMode<1.5){ float n=fbm(p*3.2); float crack=smoothstep(0.46,0.5,n)-smoothstep(0.5,0.55,n); col=mix(uA,uB,step(0.5,n)); col+=uB*crack*3.2; }
    else if(uMode<2.5){ float n=fbm(p*2.6); col=mix(uA,uB,n); col+=uB*pow(n,3.0)*0.6; }
    else if(uMode<3.5){ float n=fbm(p*1.6+3.0); col=mix(uA,uB,n); }
    else { float n=fbm(p*4.0); float m=smoothstep(0.4,0.6,n); col=mix(uA*0.7,uB,m); col+=uA*0.2*(1.0-m); }
    vec3 L=normalize(vec3(0.5,0.4,0.85)); float diff=clamp(dot(normalize(vWN),L),0.0,1.0); col*=(0.40+0.62*diff);
    float fres=pow(1.0-max(dot(normalize(vVN),vView),0.0),3.0); col+=uB*fres*uGlow;
    gl_FragColor=vec4(col,1.0); }`; }

/* 14 颗：前 4 对应真实作品，其余为创意星球 */
const PLANET_DEFS=[
  {a:[0.10,0.32,0.55],b:[0.75,0.85,1.0],mode:0,glow:0.5,ring:false,info:WORKS[0]},
  {a:[0.55,0.20,0.12],b:[1.0,0.55,0.18],mode:1,glow:1.4,ring:false,info:WORKS[1]},
  {a:[0.20,0.55,0.65],b:[0.80,0.95,1.0],mode:2,glow:0.8,ring:false,info:WORKS[2]},
  {a:[0.45,0.18,0.55],b:[0.85,0.55,1.0],mode:3,glow:0.9,ring:false,info:WORKS[3]},
  {a:[0.30,0.22,0.12],b:[0.75,0.55,0.30],mode:4,glow:0.3,ring:true,info:{title:"星核熔炉",genre:["世界"],progress:0,desc:"一切故事的源头，炽热而沉默。"}},
  {a:[0.10,0.45,0.40],b:[0.60,0.95,0.80],mode:0,glow:0.6,ring:false,info:{title:"翠环之境",genre:["生态"],progress:0,desc:"被绿意包裹的安静行星。"}},
  {a:[0.55,0.12,0.30],b:[1.0,0.45,0.65],mode:1,glow:1.2,ring:false,info:{title:"赤红裂界",genre:["战祸"],progress:0,desc:"地表遍布发光的裂隙。"}},
  {a:[0.15,0.40,0.55],b:[0.65,0.90,1.0],mode:2,glow:0.7,ring:false,info:{title:"霜晶星",genre:["凛冬"],progress:0,desc:"剔透的冰晶在轨道间闪烁。"}},
  {a:[0.50,0.40,0.10],b:[1.0,0.85,0.40],mode:3,glow:0.9,ring:true,info:{title:"黄金宝星",genre:["传说"],progress:0,desc:"环带流转着古老的光。"}},
  {a:[0.25,0.45,0.20],b:[0.80,1.0,0.70],mode:4,glow:0.3,ring:false,info:{title:"苔原星",genre:["荒野"],progress:0,desc:"缓慢生长的苔绿色世界。"}},
  {a:[0.35,0.20,0.55],b:[0.90,0.70,1.0],mode:0,glow:0.7,ring:false,info:{title:"紫气星",genre:["秘术"],progress:0,desc:"紫色气态下藏着低语。"}},
  {a:[0.40,0.15,0.15],b:[1.0,0.40,0.35],mode:1,glow:1.3,ring:false,info:{title:"炽炎星",genre:["炼狱"],progress:0,desc:"永不停歇的熔岩之舞。"}},
  {a:[0.15,0.40,0.55],b:[0.65,0.90,1.0],mode:2,glow:0.8,ring:false,info:{title:"深蓝冰星",genre:["寒渊"],progress:0,desc:"极寒深处的蓝。"}},
  {a:[0.45,0.30,0.50],b:[0.95,0.80,1.0],mode:3,glow:0.9,ring:false,info:{title:"幻紫宝星",genre:["梦境"],progress:0,desc:"梦境凝成的紫色球体。"}},
];

const planets=[];
PLANET_DEFS.forEach((d,idx)=>{
  const r=0.7+(idx%5)*0.22;
  const m=new THREE.Mesh(new THREE.SphereGeometry(r,96,96),
    new THREE.ShaderMaterial({uniforms:{
      uTime:{value:0},
      uA:{value:new THREE.Color(d.a[0],d.a[1],d.a[2])},
      uB:{value:new THREE.Color(d.b[0],d.b[1],d.b[2])},
      uMode:{value:d.mode},uGlow:{value:d.glow}
    },vertexShader:planetVert,fragmentShader:planetFrag()}));
  const ang=(idx/PLANET_DEFS.length)*Math.PI*2;
  const dist=6.2+(idx%4)*1.5;
  const y=(idx%3-1)*2.6;
  m.position.set(Math.cos(ang)*dist, y, Math.sin(ang)*dist*0.8 - 1.5);
  m.userData={spin:0.05+Math.random()*0.12, baseScale:1, info:d.info};
  scene.add(m); planets.push(m);
  if(d.ring){
    const ring=new THREE.Mesh(new THREE.RingGeometry(r*1.5,r*2.5,96),
      new THREE.MeshBasicMaterial({color:new THREE.Color(d.b[0],d.b[1],d.b[2]),
        transparent:true,opacity:0.3,side:THREE.DoubleSide,depthWrite:false}));
    ring.rotation.x=Math.PI*0.5-0.5; ring.rotation.y=0.3; m.add(ring);
  }
});

/* 背景星点（填满） */
const STAR_N=520, sg=new THREE.BufferGeometry(), sp=new Float32Array(STAR_N*3);
for(let i=0;i<STAR_N;i++){
  sp[i*3]=(Math.random()-0.5)*120; sp[i*3+1]=(Math.random()-0.5)*80; sp[i*3+2]=(Math.random()-0.5)*90-10;
}
sg.setAttribute('position',new THREE.BufferAttribute(sp,3));
scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0x9fb6e0,size:0.08,transparent:true,opacity:0.6,sizeAttenuation:true,depthWrite:false})));

/* ============ 点击星球 → 聚焦 + 详情卡 ============ */
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2();
let selected=null, downPt=null;
const detail=document.getElementById('detail');
function showDetail(info){
  document.getElementById('dGenre').innerHTML=(info.genre||[]).map(g=>`<span class="chip">${g}</span>`).join('');
  document.getElementById('dTitle').textContent=info.title;
  document.getElementById('dDesc').textContent=info.desc;
  document.getElementById('dPct').textContent=(info.progress||0)+'%';
  document.getElementById('dBar').style.width=(info.progress||0)+'%';
  detail.classList.add('show');
}
function hideDetail(){ detail.classList.remove('show'); selected=null; }
canvas.addEventListener('pointerdown',e=>{ downPt={x:e.clientX,y:e.clientY}; });
canvas.addEventListener('pointerup',e=>{
  if(!downPt) return;
  const moved=Math.hypot(e.clientX-downPt.x,e.clientY-downPt.y); downPt=null;
  if(moved>6) return;                       // 拖拽不算点击
  const rect=canvas.getBoundingClientRect();
  mouse.x=((e.clientX-rect.left)/rect.width)*2-1;
  mouse.y=-((e.clientY-rect.top)/rect.height)*2+1;
  ray.setFromCamera(mouse,camera);
  const hits=ray.intersectObjects(planets,false);
  if(hits.length){ selected=hits[0].object;
    controls.autoRotate=false; showDetail(selected.userData.info);
  } else { controls.autoRotate=true; hideDetail(); }
});
document.getElementById('dClose').addEventListener('click',()=>{ controls.autoRotate=true; hideDetail(); });

/* ============ 动画 ============ */
const clock=new THREE.Clock();
function animate(){
  const t=clock.getElapsedTime();
  earthMat.uniforms.uTime.value=t; earth.rotation.y=t*0.04; atmo.rotation.y=earth.rotation.y;
  planets.forEach(m=>{ m.material.uniforms.uTime.value=t; m.rotation.y+=m.userData.spin*0.01; m.rotation.x+=m.userData.spin*0.004;
    const s=selected===m?1.18:1.0; m.scale.lerp(new THREE.Vector3(s,s,s),0.12); });
  // 选中时把视角焦点平滑移到该星球
  const tgt=selected?selected.position:new THREE.Vector3(0,0,0);
  controls.target.lerp(tgt,0.06); controls.update();
  renderer.render(scene,camera); requestAnimationFrame(animate);
}
animate();

/* 自适应（按 galaxy 尺寸） */
function resize(){
  const w=galaxyEl.clientWidth, h=galaxyEl.clientHeight;
  renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize); resize();
</script>
</body>
</html>
