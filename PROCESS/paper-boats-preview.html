<script>
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const seaH=(x,z,t)=>0.19*Math.sin(0.5*x+t*0.8)+0.13*Math.sin(0.7*z+t*1.1);
const NOISE=`float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
float vnoise(vec2 x){ vec2 i=floor(x), f=fract(x); f=f*f*(3.0-2.0*f); float a=hash(i),b=hash(i+vec2(1,0)),c=hash(i+vec2(0,1)),d=hash(i+vec2(1,1)); return mix(mix(a,b,f.x),mix(c,d,f.x),f.y); }
float fbm(vec2 p){ float v=0.0,a=0.5; for(int i=0;i<5;i++){ v+=a*vnoise(p); p*=2.03; a*=0.5; } return v; }`;
const seaVert=`uniform float uTime; varying vec3 vWP; varying vec3 vN;
float waveH(float x, float z, float t){ return 0.19*sin(0.5*x + t*0.8) + 0.13*sin(0.7*z + t*1.1); }
void main(){ vec4 wp=modelMatrix*vec4(position,1.0); float h=waveH(wp.x,wp.z,uTime); wp.y+=h;
 float e=0.4; float hx=waveH(wp.x+e,wp.z,uTime)-waveH(wp.x-e,wp.z,uTime); float hz=waveH(wp.x,wp.z+e,uTime)-waveH(wp.x,wp.z-e,uTime);
 vN=normalize(vec3(-hx,2.0*e,-hz)); vWP=wp.xyz; gl_Position=projectionMatrix*viewMatrix*wp; }`;
const seaFrag=NOISE+`uniform float uTime; varying vec3 vWP; varying vec3 vN;
void main(){ vec3 V=normalize(cameraPosition-vWP); vec3 N=normalize(vN);
 float fres=pow(1.0-max(dot(V,N),0.0),2.2);
 vec3 deep=vec3(0.10,0.30,0.60); vec3 sheen=vec3(0.45,0.70,0.95);
 vec3 col=deep+sheen*fres*1.1;
 float flow=fbm(vWP.xz*0.35+vec2(uTime*0.03,uTime*0.02)); col+=vec3(0.12,0.28,0.50)*flow*0.55;
 float foam=smoothstep(0.62,0.82,fbm(vWP.xz*1.6+vec2(uTime*0.05,uTime*0.03))); col+=vec3(1.0,1.0,1.0)*foam*0.45;
 float rings=sin(length(vWP.xz)*7.0-uTime*2.5); col+=vec3(1.0)*smoothstep(0.88,1.0,abs(rings))*0.08;
 gl_FragColor=vec4(col,1.0); }`;

const GENRE_COLORS={"武侠":[0.45,0.80,0.45],"仙侠":[0.35,0.85,0.80],"冒险":[0.40,0.65,1.00],"悬疑":[0.95,0.45,0.50],"历史":[0.95,0.75,0.40],"科幻":[0.35,0.60,1.00]};
const DEFAULT_COLOR=[0.45,0.70,1.00];
function genreColor(g){ if(g&&GENRE_COLORS[g])return GENRE_COLORS[g]; return DEFAULT_COLOR; }
const TYPE_NAMES={wupeng:"黑珍珠号",tower:"复仇女王号",sail:"飞翔的荷兰人",fishing:"航空母舰",dragon:"驱逐舰",mech:"核潜艇"};
const GENRE_TO_TYPE={武侠:"wupeng",仙侠:"tower",冒险:"sail",悬疑:"mech",历史:"tower",科幻:"fishing"};
function boatTypeFor(g){ if(g&&GENRE_TO_TYPE[g])return GENRE_TO_TYPE[g]; return "wupeng"; }

function makeWoodTex(){ const c=document.createElement("canvas"); c.width=128; c.height=128; const x=c.getContext("2d");
  x.fillStyle="#3a3328"; x.fillRect(0,0,128,128); for(let i=0;i<26;i++){ x.strokeStyle=`rgba(${90+Math.random()*50},${80+Math.random()*45},${55+Math.random()*35},${0.25+Math.random()*0.3})`; x.lineWidth=1+Math.random()*2.4;
    x.beginPath(); const sx=Math.random()*128; x.moveTo(sx,0); x.bezierCurveTo(sx+(Math.random()*30-15),42,sx+(Math.random()*30-15),86,sx+(Math.random()*20-10),128); x.stroke(); }
  const t=new THREE.CanvasTexture(c); t.needsUpdate=true; return t; }
const BLACK_MAT=new THREE.MeshStandardMaterial({color:0x181820,roughness:0.45,metalness:0.25,side:THREE.DoubleSide});
const GOLD_MAT=new THREE.MeshStandardMaterial({color:0xd9a441,roughness:0.35,metalness:0.6});
const GHOST_MAT=new THREE.MeshStandardMaterial({color:0x2e3a42,roughness:0.7,metalness:0.1,side:THREE.DoubleSide});
const GHOST_SAIL_MAT=new THREE.MeshStandardMaterial({color:0x9aa4a8,roughness:0.9,transparent:true,opacity:0.72,side:THREE.DoubleSide});
const GHOST_GLOW=new THREE.MeshBasicMaterial({color:0x5dffd0});
const DECK_MAT=new THREE.MeshStandardMaterial({color:0x4a505c,roughness:0.85,metalness:0.1});
const HULL_GREY_MAT=new THREE.MeshStandardMaterial({color:0x58606e,roughness:0.6,metalness:0.3,side:THREE.DoubleSide});
const METAL_MAT=new THREE.MeshStandardMaterial({color:0x2a3340,roughness:0.4,metalness:0.6,side:THREE.DoubleSide});
const DARK_MAT=new THREE.MeshStandardMaterial({color:0x141a26,roughness:0.7,metalness:0.1,side:THREE.DoubleSide});
const COLD_MAT=new THREE.MeshBasicMaterial({color:0x6fd6ff});
const CORE_WARM=new THREE.MeshBasicMaterial({color:0xfff2d8});
let _woodMat=null;
const getWoodMat=()=> _woodMat||(_woodMat=new THREE.MeshStandardMaterial({map:makeWoodTex(),color:0x4a4133,roughness:0.85,metalness:0.0}));

function makeHull(L,W,H,opt){ opt=opt||{}; const sheer=opt.sheer||0.18,keel=opt.keel||0.16,bottomTaper=opt.bottomTaper||0.42,segsX=opt.segsX||14,segsZ=opt.segsZ||6;
  const g=new THREE.BoxGeometry(L,H,W,segsX,1,segsZ); const p=g.attributes.position;
  for(let i=0;i<p.count;i++){ let x=p.getX(i),y=p.getY(i),z=p.getZ(i); const t=(x+L/2)/L;
    const wMul=Math.pow(Math.sin(Math.PI*t),0.5); z*=wMul;
    y+=sheer*Math.pow(t,3)+sheer*0.32*Math.pow(1-t,3);
    if(y<0){ const f=(y+H/2)/H; z*=bottomTaper+(1-bottomTaper)*f*2; }
    if(y<0&&Math.abs(z)<0.06*W) y-=keel*0.4;
    p.setXYZ(i,x,y,z);
  } g.computeVertexNormals(); return g; }
function makeMast(len,r){ return new THREE.Mesh(new THREE.CylinderGeometry(r||0.035,r||0.035*1.3,len,7),getWoodMat()); }
function makeSailPnl(w,h,mat){ const geo=new THREE.PlaneGeometry(w,h,6,6); const p=geo.attributes.position;
  for(let i=0;i<p.count;i++){ const x=p.getX(i),y=p.getY(i); const belly=0.16*(1-Math.pow(x/(w/2),2))*(1-Math.pow(y/(h/2),2)); p.setZ(i,belly); }
  geo.computeVertexNormals(); return new THREE.Mesh(geo,mat); }
function makeJet(){ const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(0.34,0.05,0.06),HULL_GREY_MAT); body.position.y=0.03; g.add(body);
  const wing=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.015,0.3),HULL_GREY_MAT); wing.position.y=0.045; g.add(wing);
  const tail=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.06,0.04),HULL_GREY_MAT); tail.position.set(-0.13,0.06,0); g.add(tail);
  const m=new THREE.Mesh(new THREE.BoxGeometry(0.34,0.05,0.06),HULL_GREY_MAT); m.add(g); return m; }
function makeTurret(){ const g=new THREE.Group();
  const base=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.08,0.16),DARK_MAT); base.position.y=0.05; g.add(base);
  const barrel=new THREE.Mesh(new THREE.CylinderGeometry(0.012,0.012,0.3,6),DARK_MAT); barrel.rotation.z=Math.PI/2; barrel.position.set(0.2,0.09,0); g.add(barrel);
  return g; }

function createBoat(type,color){ const group=new THREE.Group(); let bowLocal;
  const addEdges=(geo,col,parent)=>{ const e=new THREE.LineSegments(new THREE.EdgesGeometry(geo,22),new THREE.LineBasicMaterial({color:new THREE.Color(col[0],col[1],col[2]),transparent:true,opacity:0.65,blending:THREE.AdditiveBlending})); parent.add(e); };
  const lantern=(x,y,z)=>{ const post=new THREE.Mesh(new THREE.CylinderGeometry(0.012,0.012,0.2,5),DARK_MAT); post.position.set(x,y,z); group.add(post); return new THREE.Vector3(x,y+0.13,z); };
  const rigBlack=(L,W,H,opt)=>{ opt=opt||{};
    const hull=makeHull(L,W,H,{sheer:opt.sheer||0.28,bottomTaper:opt.bottomTaper||0.42,segsX:12,segsZ:5});
    const body=new THREE.Mesh(hull,BLACK_MAT); group.add(body); addEdges(hull,color,body);
    for(const [mx,mh] of [[-0.85,1.6],[0,1.9],[0.75,1.4]]){ const mast=makeMast(mh); mast.position.set(mx,0.45+mh/2,0); group.add(mast);
      const sail=makeSailPnl(0.9,mh*0.72,BLACK_MAT); sail.position.set(mx-0.02,0.45+mh*0.5,0.01); group.add(sail); }
    const sternSail=makeSailPnl(0.75,1.0,BLACK_MAT); sternSail.rotation.y=0.35; sternSail.position.set(0.95,1.0,0); group.add(sternSail);
    if(opt.gold){ const bowOrn=new THREE.Mesh(new THREE.SphereGeometry(0.07,8,8),GOLD_MAT); bowOrn.position.set(L/2+0.05,0.42,0); group.add(bowOrn);
      const sternCastle=new THREE.Mesh(new THREE.BoxGeometry(0.4,0.3,0.5),GOLD_MAT); sternCastle.position.set(-L/2+0.2,0.55,0); group.add(sternCastle);
      for(const sz of [-1,1]) for(let i=0;i<3;i++){ const port=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.07,0.03),GOLD_MAT); port.position.set(L/2-0.35-i*0.45,0.28,sz*(W/2+0.01)); group.add(port); } }
    return lantern(L/2+0.05,0.55,0); };
  if(type==="wupeng"){ bowLocal=rigBlack(2.6,0.85,0.75,{sheer:0.3,bottomTaper:0.4,gold:true}); }
  else if(type==="tower"){ bowLocal=rigBlack(2.5,0.95,0.85,{sheer:0.26,bottomTaper:0.45,gold:true});
    const skull=new THREE.Mesh(new THREE.SphereGeometry(0.06,8,8),new THREE.MeshStandardMaterial({color:0xe8e4d8,roughness:0.4})); skull.position.set(-1.1,1.15,0); group.add(skull); }
  else if(type==="sail"){ const hull=makeHull(2.6,0.9,0.8,{sheer:0.35,bottomTaper:0.4,segsX:12,segsZ:5}); const body=new THREE.Mesh(hull,GHOST_MAT); group.add(body); addEdges(hull,color,body);
    for(const [mx,mh] of [[-0.85,1.7],[0,2.0],[0.75,1.5]]){ const mast=makeMast(mh); mast.position.set(mx,0.5+mh/2,0); group.add(mast);
      const sail=makeSailPnl(0.95,mh*0.8,GHOST_SAIL_MAT); sail.position.set(mx-0.02,0.5+mh*0.55,0.01); group.add(sail); }
    const tusk=new THREE.Mesh(new THREE.ConeGeometry(0.03,0.5,6),new THREE.MeshStandardMaterial({color:0xd8d4c8,roughness:0.3})); tusk.rotation.z=-Math.PI/2; tusk.position.set(1.45,0.55,0); group.add(tusk);
    for(const sz of [-1,1]) for(let i=0;i<4;i++){ const glow=new THREE.Mesh(new THREE.SphereGeometry(0.035,6,6),GHOST_GLOW); glow.position.set(1.0-i*0.55,0.42,sz*0.46); group.add(glow); }
    bowLocal=lantern(1.2,0.6,0); }
  else if(type==="fishing"){ const hull=new THREE.Mesh(new THREE.BoxGeometry(3.4,0.5,1.25),HULL_GREY_MAT); hull.position.y=0.1; group.add(hull);
    const deck=new THREE.Mesh(new THREE.BoxGeometry(3.3,0.07,1.05),DECK_MAT); deck.position.y=0.4; group.add(deck);
    const island=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.55,0.32),DARK_MAT); island.position.set(-0.7,0.72,0.4); group.add(island);
    const ant=new THREE.Mesh(new THREE.CylinderGeometry(0.008,0.008,0.5,4),DARK_MAT); ant.position.set(-0.7,1.05,0.4); group.add(ant);
    const angled=new THREE.Mesh(new THREE.BoxGeometry(2.6,0.015,0.09),DARK_MAT); angled.position.set(0.1,0.44,-0.35); angled.rotation.y=0.22; group.add(angled);
    const cats=new THREE.Mesh(new THREE.BoxGeometry(0.015,0.015,0.75),GHOST_SAIL_MAT); cats.position.set(0.55,0.44,0.3); group.add(cats);
    for(const [jx,jy,jz,jr] of [[0.7,0.44,0.32,0.1],[-0.1,0.44,0.36,-0.12],[0.35,0.44,-0.3,0.25]]){ const jet=makeJet(); jet.position.set(jx,jy,jz); jet.rotation.y=jr; group.add(jet); }
    for(const sz of [-1,1]){ const sponson=new THREE.Mesh(new THREE.BoxGeometry(1.4,0.06,0.12),DARK_MAT); sponson.position.set(-0.3,0.18,sz*0.62); group.add(sponson); }
    bowLocal=lantern(1.55,0.55,0); }
  else if(type==="dragon"){ const hull=makeHull(2.8,0.55,0.45,{sheer:0.06,bottomTaper:0.6,segsX:10,segsZ:4}); const body=new THREE.Mesh(hull,HULL_GREY_MAT); group.add(body);
    const bridge=new THREE.Mesh(new THREE.BoxGeometry(0.42,0.4,0.34),DARK_MAT); bridge.position.set(-0.6,0.42,0); group.add(bridge);
    const radar=new THREE.Mesh(new THREE.BoxGeometry(0.14,0.12,0.14),DARK_MAT); radar.position.set(-0.6,0.68,0); group.add(radar);
    const gun=makeTurret(); gun.position.set(0.7,0.3,0); group.add(gun);
    for(const [mx,mz,mr] of [[0.15,0.18,0.5],[0.15,-0.18,-0.5]]){ const launcher=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.05,0.08),DARK_MAT); launcher.position.set(mx,0.36,mz); launcher.rotation.y=mr; group.add(launcher); }
    const sternGun=makeTurret(); sternGun.position.set(-1.2,0.3,0); group.add(sternGun);
    for(const [ax,az] of [[0.9,0],[-0.2,0.2],[0.4,-0.2]]){ const a=new THREE.Mesh(new THREE.CylinderGeometry(0.006,0.006,0.4,4),DARK_MAT); a.position.set(ax,0.5,az); group.add(a); }
    bowLocal=lantern(1.35,0.45,0); }
  else { const hull=new THREE.Mesh(new THREE.CylinderGeometry(0.28,0.28,2.4,12),METAL_MAT); hull.rotation.z=Math.PI/2; group.add(hull);
    const bow=new THREE.Mesh(new THREE.ConeGeometry(0.28,0.45,12),METAL_MAT); bow.rotation.z=-Math.PI/2; bow.position.set(1.35,0,0); group.add(bow);
    const stern=new THREE.Mesh(new THREE.ConeGeometry(0.28,0.35,12),METAL_MAT); stern.rotation.z=Math.PI/2; stern.position.set(-1.3,0,0); group.add(stern);
    const fin=new THREE.Mesh(new THREE.BoxGeometry(0.14,0.22,0.16),METAL_MAT); fin.position.set(-1.15,0,0); group.add(fin);
    const prop=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.18,0.06),DARK_MAT); prop.position.set(-1.5,0,0); group.add(prop);
    const sail=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.26,0.2),DARK_MAT); sail.position.set(0.15,0.35,0); group.add(sail);
    const periscope=new THREE.Mesh(new THREE.CylinderGeometry(0.008,0.008,0.3,4),DARK_MAT); periscope.position.set(0.15,0.56,0); group.add(periscope);
    const pTip=new THREE.Mesh(new THREE.SphereGeometry(0.015,6,6),GHOST_GLOW); pTip.position.set(0.15,0.7,0); group.add(pTip);
    for(const sz of [-1,1]) for(let i=0;i<2;i++){ const l=new THREE.Mesh(new THREE.SphereGeometry(0.025,6,6),GHOST_GLOW); l.position.set(0.5+i*0.7,0.1,sz*0.27); group.add(l); }
    bowLocal=lantern(1.2,0.4,0); }
  return {group,bowLocal}; }

  {id:"6",name:"量子回廊",genre:"科幻",targetWordCount:75000,storyNodes:15,updatedAt:Date.now()-8*86400000},
];

const mount=document.getElementById("stage");
const scene=new THREE.Scene(); scene.fog=new THREE.Fog(0x0a2a55,24,52);
const camera=new THREE.PerspectiveCamera(50,1,0.1,120);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true}); renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.75)); renderer.setClearColor(0x0a2a55,1);
mount.appendChild(renderer.domElement); const cv=renderer.domElement; cv.style.width="100%"; cv.style.height="100%"; cv.style.display="block"; cv.style.cursor="grab";
scene.add(new THREE.AmbientLight(0x3a4a72,1.0)); const sun=new THREE.DirectionalLight(0xffffff,0.9); sun.position.set(8,14,10); scene.add(sun);
const LAMP_MAX=8; const lampPool=[]; for(let i=0;i<LAMP_MAX;i++){ const pl=new THREE.PointLight(0xffffff,0,7,2); pl.castShadow=false; scene.add(pl); lampPool.push(pl); }
const seaMat=new THREE.ShaderMaterial({uniforms:{uTime:{value:0}},vertexShader:seaVert,fragmentShader:seaFrag});
const sea=new THREE.Mesh(new THREE.PlaneGeometry(64,40,130,80),seaMat); sea.rotation.x=-Math.PI/2; scene.add(sea);

const boats=[]; const N=SAMPLE.length;
SAMPLE.forEach((p,i)=>{ const color=genreColor(p.genre); const type=boatTypeFor(p.genre);
  const scale=clamp(0.72+(p.targetWordCount??60000)/160000,0.72,1.5);
  const days=(Date.now()-new Date(p.updatedAt).getTime())/86400000; const bright=clamp(1-days/30,0.35,1);
  const baseX=N>1?-11+(22/(N-1))*i:0; const baseZ=Math.sin(i*1.3)*3.2-1;
  const built=createBoat(type,color); const group=built.group; group.userData={index:i,id:p.id,name:p.name};
  const lampCore=new THREE.Mesh(new THREE.SphereGeometry(0.07,12,12),type==="mech"?COLD_MAT:CORE_WARM); lampCore.position.copy(built.bowLocal); group.add(lampCore);
  group.scale.setScalar(scale); scene.add(group);
  boats.push({id:p.id,name:p.name,type,color,group,bowLocal:built.bowLocal,baseX,baseZ,scale,bright,bornAt:i*0.35,landed:false,phase:Math.random()*Math.PI*2});
});

const ray=new THREE.Raycaster(); const mouse=new THREE.Vector2(); let downX=0,downY=0; let dragging=false,lastX=0,lastY=0;
let tYaw=0,tPitch=0.24,tRadius=13; let cYaw=0,cPitch=0.24,cRadius=13; const lookTarget=new THREE.Vector3(0,0.3,-1);
const hoverchip=document.getElementById("hoverchip"); let hoverIdx=-1;
const pickBoat=(e)=>{ const rect=cv.getBoundingClientRect(); mouse.x=((e.clientX-rect.left)/rect.width)*2-1; mouse.y=-((e.clientY-rect.top)/rect.height)*2+1; ray.setFromCamera(mouse,camera); const hits=ray.intersectObjects(boats.map(b=>b.group),true); if(!hits.length)return null; let o=hits[0].object; while(o&&o.userData.index===undefined)o=o.parent; return o?o.userData.index:null; };
cv.addEventListener("pointermove",(e)=>{ if(dragging){ tYaw-=(e.clientX-lastX)*0.006; tPitch=clamp(tPitch+(e.clientY-lastY)*0.004,0.12,1.1); lastX=e.clientX; lastY=e.clientY; }
  const idx=pickBoat(e); cv.style.cursor=idx!=null?"pointer":(dragging?"grabbing":"grab");
  if(idx!==hoverIdx){ hoverIdx=idx; if(idx!=null&&boats[idx]){ hoverchip.textContent="《"+boats[idx].name+"》"; hoverchip.style.display="block"; } else hoverchip.style.display="none"; } });
cv.addEventListener("pointerdown",(e)=>{ downX=e.clientX; downY=e.clientY; lastX=e.clientX; lastY=e.clientY; dragging=true; });
cv.addEventListener("pointerup",(e)=>{ dragging=false; if(Math.hypot(e.clientX-downX,e.clientY-downY)>6)return; const idx=pickBoat(e); if(idx==null)return; if(!confirm("你确认要进入《"+boats[idx].name+"》吗？"))return; alert("进入写作区："+boats[idx].name); });
cv.addEventListener("wheel",(e)=>{ e.preventDefault(); tRadius=clamp(tRadius*(1+e.deltaY*0.0012),6,26); },{passive:false});

const resize=()=>{ const w=mount.clientWidth,h=mount.clientHeight; if(!w||!h)return; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }; resize(); new ResizeObserver(resize).observe(mount);
const clock=new THREE.Clock(); let raf=0; let running=false;
const renderOnce=()=>{ const t=clock.getElapsedTime(); seaMat.uniforms.uTime.value=t;
  boats.forEach(b=>{ let y; if(!b.landed){ const pp=clamp((t-b.bornAt)/1.2,0,1); const ease=1-Math.pow(1-pp,3); y=THREE.MathUtils.lerp(12,seaH(b.baseX,b.baseZ,t),ease); if(pp>=1){ b.landed=true; b.landAt=t; } } else { y=seaH(b.baseX,b.baseZ,t); if(b.landAt!=null){ const dt=t-b.landAt; if(dt<0.6) y+=Math.max(0,Math.sin(dt*9))*0.12*(1-dt/0.6); } }
    b.group.position.set(b.baseX,y,b.baseZ); b.group.rotation.z=Math.sin(t*0.8+b.phase)*0.1; b.group.rotation.x=Math.cos(t*0.6+b.phase)*0.07; b.group.scale.setScalar(b.scale); });
  boats.forEach(b=>b.group.updateMatrixWorld());
  const scored=boats.map((b,i)=>({i,d:b.group.position.distanceTo(camera.position)-b.bright*4})); scored.sort((a,c)=>a.d-c.d);
  const lit=new Set(); for(const s of scored){ if(lit.size>=LAMP_MAX)break; lit.add(s.i); }
  lampPool.forEach((pl,n)=>{ if(n<lit.size){ const b=boats[[...lit][n]]; const wp=b.group.localToWorld(b.bowLocal.clone()); pl.position.copy(wp); pl.color.setRGB(b.color[0],b.color[1],b.color[2]); pl.intensity=b.bright*(1.5+Math.sin(t*2+b.phase)*0.25); } else pl.intensity=0; });
  cYaw+=(tYaw-cYaw)*0.08; cPitch+=(tPitch-cPitch)*0.08; cRadius+=(tRadius-cRadius)*0.08;
  const cp=Math.cos(cPitch),sp=Math.sin(cPitch);
  camera.position.lerp(new THREE.Vector3(Math.sin(cYaw)*cp*cRadius, sp*cRadius+1.6, Math.cos(cYaw)*cp*cRadius),0.12);
  lookTarget.lerp(new THREE.Vector3(0,0.3,-1),0.1); camera.lookAt(lookTarget);
  renderer.render(scene,camera); };
const animate=()=>{ if(!running)return; renderOnce(); raf=requestAnimationFrame(animate); };
const start=()=>{ if(running)return; running=true; raf=requestAnimationFrame(animate); };
const stop=()=>{ running=false; cancelAnimationFrame(raf); };
renderOnce();
document.addEventListener("visibilitychange",()=>{ if(document.hidden)stop(); else start(); });
new IntersectionObserver((es)=>{ if(es[0].isIntersecting)start(); else stop(); },{rootMargin:"100px"}).observe(mount);
start();

const picks=document.getElementById("picks");
SAMPLE.forEach(p=>{ const c=genreColor(p.genre); const tp=boatTypeFor(p.genre); const el=document.createElement("button"); el.className="pick";
  const rgb=`rgb(${c[0]*255},${c[1]*255},${c[2]*255})`; el.innerHTML=`<span class="sw" style="background:${rgb};box-shadow:0 0 8px ${rgb}"></span><span class="nm">${p.name}</span><span class="tp">${TYPE_NAMES[tp]}</span>`;
  el.onclick=()=>{ if(confirm("你确认要进入《"+p.name+"》吗？")) alert("进入写作区："+p.name); }; picks.appendChild(el); });
const legend=document.getElementById("legend");
const LEG=[["黑珍珠号","黑色三桅 + 黑帆 + 金饰炮门，加勒比最快船","武侠/言情/田园"],["复仇女王号","黑胡子旗舰：黑帆金饰 + 骷髅，炮窗林立","仙侠/玄幻/历史"],["飞翔的荷兰人","幽灵船：青灰船体 + 破帆 + 幽绿舷灯 + 独角鲸牙","冒险/西幻"],["航空母舰","宽平甲板 + 右舷舰岛 + 斜角甲板 + 舰载机（子舰=作品）","科幻/军事"],["驱逐舰","现代军舰：舰桥 + 主炮 + 导弹架 + 雷达天线","推理/都市"],["核潜艇","圆柱艇身 + 围壳 + 潜望镜 + 螺旋桨","悬疑/灵异/谍战"]];
LEG.forEach(([n,d,g])=>{ const el=document.createElement("div"); el.className="lg"; el.innerHTML=`<h4>${n}</h4><p>${d}<br><span style="color:var(--nv-text-muted)">映射：${g}</span></p>`; legend.appendChild(el); });
</script>
</body>
</html>
